<!DOCTYPE html>
<html>
<head>
  <title>RevUp - Dashboard</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial;
      padding: 20px;
    }
    h1, h2 {
      color: #fdd835;
    }
    .section {
      background: #222;
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>RevUp AI Hotel Dashboard</h1>

  <div class="section">
    <h2>Forecast</h2>
    <pre id="forecast"></pre>
  </div>

  <div class="section">
    <h2>Prices</h2>
    <pre id="prices"></pre>
  </div>

  <div class="section">
    <h2>Events</h2>
    <pre id="events"></pre>
  </div>

  <div class="section">
    <h2>Bookings</h2>
    <pre id="bookings"></pre>
  </div>

  <script>
    fetch("https://revup-backend.onrender.com/dashboard")
      .then(res => res.json())
      .then(data => {
        document.getElementById("forecast").textContent = JSON.stringify(data.forecast, null, 2);
        document.getElementById("prices").textContent = JSON.stringify(data.pricing, null, 2);
        document.getElementById("events").textContent = JSON.stringify(data.events, null, 2);
        document.getElementById("bookings").textContent = JSON.stringify(data.bookings, null, 2);
      })
      .catch(err => console.error("API fetch error:", err));
  </script>
</body>
</html>
